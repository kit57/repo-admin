services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_PATH: /data/repo_admin.db
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - repo-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Local open-weight model server — the default LLM provider.
  ollama:
    image: ollama/ollama:0.40.6
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot job that downloads the default model into the ollama volume.
  ollama-pull:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  repo-data:
  ollama-data:
